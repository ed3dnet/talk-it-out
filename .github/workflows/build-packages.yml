name: Build Linux Packages

on:
  push:
    branches:
      - main
      - "ed/packaging*"
    tags:
      - "v*.*.*"
  pull_request:
    paths:
      - "nfpm.yaml"
      - "scripts/build-nfpm.bash"
      - "scripts/ensure-fedora.bash"
      - "pyproject.toml"
      - "src/**"

jobs:
  build-packages:
    name: Build ${{ matrix.packager }} with NFPM
    runs-on: ubuntu-latest
    strategy:
      matrix:
        packager: [rpm, deb]
    container:
      image: fedora:42
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install build dependencies
        run: bash scripts/ensure-fedora.bash

      - name: Build ${{ matrix.packager }} package with NFPM
        run: bash scripts/build-nfpm.bash ${{ matrix.packager }}

      - name: Upload ${{ matrix.packager }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.packager }}-package
          path: |
            talk-it-out-*.rpm
            talk-it-out_*.deb
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: [build-packages]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: packages

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/*/*.rpm
            packages/*/*.deb
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') }}
