[project]
name = "talk-it-out"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.9.0",
    "structlog>=24.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "tomli-w>=1.0.0",
    "evdev>=1.6.0",
    "numpy",
    "sounddevice>=0.5.3",
    "scipy",
    "faster-whisper>=1.2.0",
    "pyqt6>=6.10.0",
]

[project.scripts]
talk-it-out = "talk_it_out.main:app"

[dependency-groups]
dev = [
    "pyright>=1.1.407",
    "pytest>=8.0.0",
]

[tool.uv]
package = true
